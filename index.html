<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>二连杆逆运动学 解析法&数值迭代演示</title>
<style>
*{box-sizing:border-box;font-family:system-ui, sans-serif;}
body{background:#f6f6f6;padding:16px;margin:0;}
.wrap{max-width:1050px;margin:0 auto;}
canvas{border:1px solid #aaa;background:#fff;}
.ctrl{margin:10px 0;}
button{padding:7px 14px;margin:0 4px;border:none;border-radius:6px;background:#366ed8;color:#fff;font-size:15px;cursor:pointer}
.info-text{margin-top:8px;font-size:14px;color:#333}
</style>
</head>
<body>
<div class="wrap">
  <div class="ctrl">
    <button onclick="switchMode('analytic')">解析法演示</button>
    <button onclick="switchMode('numeric')">数值法演示</button>
  </div>
  <canvas id="cv" width="800" height="700"></canvas>
  <div class="info-text">请点击画布以设置新目标</div>
</div>

<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
const scale = 160; //缩放比例
const ox = W/2, oy = H/2; //画布原点
const L1 = 1.0, L2 = 1.0; //杆长
let mode = 'analytic'; // analytic / numeric
let target = {x:1.2, y:0.2};
let numInitTheta = {t1:0.2, t2:0.2}; //数值法初始猜测角度
let iterTraj = []; //迭代路径点

// 坐标转换：数学坐标 → canvas像素
function toPx(x,y){
  return {
    px: ox + x * scale,
    py: oy - y * scale
  }
}
// 画网格坐标轴
function drawGrid(){
  ctx.clearRect(0,0,W,H);
  ctx.strokeStyle="#ddd";
  ctx.lineWidth=1;
  //网格
  for(let i=-2;i<=2;i+=0.5){
    let p1 = toPx(i,-2);
    let p2 = toPx(i,2);
    ctx.beginPath();ctx.moveTo(p1.px,p1.py);ctx.lineTo(p2.px,p2.py);ctx.stroke();
    p1 = toPx(-2,i);
    p2 = toPx(2,i);
    ctx.beginPath();ctx.moveTo(p1.px,p1.py);ctx.lineTo(p2.px,p2.py);ctx.stroke();
  }
  //xy轴
  ctx.strokeStyle="#888";
  let x0 = toPx(-2,0), x1=toPx(2,0);
  ctx.beginPath();ctx.moveTo(x0.px,x0.py);ctx.lineTo(x1.px,x1.py);ctx.stroke();
  let y0 = toPx(0,-2), y1=toPx(0,2);
  ctx.beginPath();ctx.moveTo(y0.px,y0.py);ctx.lineTo(y1.px,y1.py);ctx.stroke();
}

// 正运动学
function fk(t1,t2){
  const x1 = L1*Math.cos(t1);
  const y1 = L1*Math.sin(t1);
  const x2 = x1 + L2*Math.cos(t1+t2);
  const y2 = y1 + L2*Math.sin(t1+t2);
  return {x1,y1,x2,y2};
}

// 解析逆解：返回两个解 [高手肘,低手肘]
function ikAnalytic(tx,ty){
  const r2 = tx*tx + ty*ty;
  const r = Math.sqrt(r2);
  if(r > L1+L2 || r < Math.abs(L1-L2)) return null;
  const c2 = (r2 - L1*L1 - L2*L2)/(2*L1*L2);
  const s2p = Math.sqrt(1-c2*c2);
  const s2n = -s2p;
  const th2p = Math.atan2(s2p,c2);
  const th2n = Math.atan2(s2n,c2);
  const phi = Math.atan2(ty,tx);
  const betaP = Math.atan2(L2*s2p, L1+L2*c2);
  const betaN = Math.atan2(L2*s2n, L1+L2*c2);
  const th1p = phi - betaP;
  const th1n = phi - betaN;
  return [
    {t1:th1p, t2:th2p}, //高手肘
    {t1:th1n, t2:th2n}  //低手肘
  ]
}

// 阻尼最小二乘数值迭代
function ikNumeric(tx,ty,initT1,initT2,maxIter=80, tol=0.003, lam=0.04){
  let t1 = initT1, t2 = initT2;
  let traj = [];
  for(let i=0;i<maxIter;i++){
    const f = fk(t1,t2);
    traj.push({x:f.x2,y:f.y2});
    const ex = tx - f.x2;
    const ey = ty - f.y2;
    if(Math.hypot(ex,ey) < tol) break;
    const J11 = -L1*Math.sin(t1) - L2*Math.sin(t1+t2);
    const J12 = -L2*Math.sin(t1+t2);
    const J21 = L1*Math.cos(t1) + L2*Math.cos(t1+t2);
    const J22 = L2*Math.cos(t1+t2);
    const det = J11*J22 - J12*J21;
    const d1 = J22*ex - J12*ey;
    const d2 = -J21*ex + J11*ey;
    const denom = det*det + lam*lam;
    const dt1 = det*d1 / denom;
    const dt2 = det*d2 / denom;
    t1 += dt1; t2 += dt2;
  }
  return {t1,t2,traj};
}

// 绘制解析法画面
function drawAnalytic(){
  drawGrid();
  //最大工作范围虚线圆
  ctx.strokeStyle="#aaa";
  ctx.setLineDash([6,4]);
  ctx.lineWidth=1.5;
  const c = toPx(0,0);
  ctx.beginPath();
  ctx.arc(c.px,c.py, scale*(L1+L2),0,Math.PI*2);
  ctx.stroke();
  ctx.setLineDash([]);

  const sols = ikAnalytic(target.x, target.y);
  //标题
  ctx.fillStyle="#222";
  ctx.font="18px system-ui";
  if(!sols){
    ctx.fillText("解析法演示：目标不可达！", 20, 30);
  }else{
    ctx.fillText("解析法演示：已找到所有精确解", 20, 30);
  }
  //图例
  ctx.font="14px";
  ctx.fillStyle="#444";
  ctx.fillText("■ 最大工作范围(虚线)", 600, 30);
  ctx.fillStyle="#0044bb";
  ctx.fillText("■ 解1（高手肘）", 600, 52);
  ctx.fillStyle="#008822";
  ctx.fillText("■ 解2（低手肘）", 600, 74);
  ctx.fillStyle="#dd2222";
  ctx.fillText("✖ 目标点", 600, 96);

  if(sols){
    //高手肘 蓝色实线
    const fk1 = fk(sols[0].t1, sols[0].t2);
    drawArm(fk1, "#0044bb", 3);
    //低手肘 绿色虚线
    const fk2 = fk(sols[1].t1, sols[1].t2);
    drawArm(fk2, "#008822", 3, true);
  }
  //目标红叉
  drawTarget(target.x, target.y);
}

//绘制数值法画面
function drawNumeric(){
  drawGrid();
  ctx.fillStyle="#222";
  ctx.font="18px system-ui";
  ctx.fillText("数值法演示：迭代收敛成功！", 20, 30);
  //图例
  ctx.font="14px";
  ctx.fillStyle="#dd2222";
  ctx.fillText("✖ 目标点", 600, 30);
  ctx.fillStyle="#888";
  ctx.fillText("■ 初始猜测", 600, 52);
  ctx.fillStyle="#9922bb";
  ctx.fillText("■ 迭代路径", 600, 74);
  ctx.fillStyle="#660077";
  ctx.fillText("■ 最终解", 600, 96);

  //先跑迭代
  const res = ikNumeric(target.x, target.y, numInitTheta.t1, numInitTheta.t2);
  iterTraj = res.traj;
  const fkFin = fk(res.t1, res.t2);

  //初始猜测姿态
  const fkInit = fk(numInitTheta.t1, numInitTheta.t2);
  drawArm(fkInit, "#888888", 2, true);

  //紫色虚线迭代轨迹
  ctx.strokeStyle="#9922bb";
  ctx.setLineDash([4,3]);
  ctx.lineWidth=2;
  ctx.beginPath();
  const p0 = toPx(iterTraj[0].x, iterTraj[0].y);
  ctx.moveTo(p0.px, p0.py);
  for(let p of iterTraj){
    let pp = toPx(p.x,p.y);
    ctx.lineTo(pp.px, pp.py);
  }
  ctx.stroke();
  ctx.setLineDash([]);

  //最终机械臂 深紫色实线
  drawArm(fkFin, "#660077", 4);
  //目标红叉
  drawTarget(target.x, target.y);
}

//画机械臂
function drawArm(fk, color, lw, dash=false){
  ctx.strokeStyle = color;
  ctx.lineWidth = lw;
  if(dash) ctx.setLineDash([5,4]); else ctx.setLineDash([]);
  ctx.beginPath();
  let p0 = toPx(0,0);
  let p1 = toPx(fk.x1, fk.y1);
  let p2 = toPx(fk.x2, fk.y2);
  ctx.moveTo(p0.px,p0.py);
  ctx.lineTo(p1.px,p1.py);
  ctx.lineTo(p2.px,p2.py);
  ctx.stroke();
  ctx.setLineDash([]);
  //关节黑点
  ctx.fillStyle="#111";
  drawCircle(p0.px,p0.py,5);
  drawCircle(p1.px,p1.py,5);
  drawCircle(p2.px,p2.py,5);
}
function drawCircle(px,py,r){
  ctx.beginPath();ctx.arc(px,py,r,0,Math.PI*2);ctx.fill();
}
//画红色叉号目标
function drawTarget(x,y){
  const p = toPx(x,y);
  ctx.strokeStyle="#dd2222";
  ctx.lineWidth=3;
  const s=8;
  ctx.beginPath();
  ctx.moveTo(p.px-s, p.py-s);
  ctx.lineTo(p.px+s, p.py+s);
  ctx.moveTo(p.px+s, p.py-s);
  ctx.lineTo(p.px-s, p.py+s);
  ctx.stroke();
}

function render(){
  if(mode==='analytic') drawAnalytic();
  else drawNumeric();
}
function switchMode(m){
  mode = m;
  render();
}

//鼠标点击设置目标
cv.onclick = function(e){
  const rect = cv.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const x = (mx - ox)/scale;
  const y = -(my - oy)/scale;
  target = {x,y};
  //每次点击重置数值法初始猜测
  numInitTheta = {t1:0.15, t2:0.15};
  render();
}

render();
</script>
</body>
</html>
